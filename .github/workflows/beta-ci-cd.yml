name: Beta (Staging/QA) CI/CD

on:
  push:
    branches:
      - beta

concurrency:
  group: beta-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Test & Validate (Beta)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Code Formatting & Lint Check
        run: npm run lint

      - name: Run Automated Tests (if configured)
        run: npm test --if-present

  build-and-deploy:
    name: Build & Deploy to Staging (Beta)
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.env_url || 'https://beta.alamirtech.com' }}
    env:
      NODE_ENV: production
      APP_ENV: staging
      NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL || 'https://beta.alamirtech.com' }}
      NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'https://beta-api.alamirtech.com/api' }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js Application (Staging Artifact)
        run: npm run build

      - name: Deploy to Staging Environment
        id: deploy
        run: |
          echo "=============================================="
          echo "Deploying to Beta / Staging Environment"
          echo "Target Branch: beta"
          echo "Commit: ${{ github.sha }}"
          echo "=============================================="
          
          if [ -n "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "Deploying via Vercel CLI to Preview/Staging..."
            npx vercel --token ${{ secrets.VERCEL_TOKEN }} --scope ${{ secrets.VERCEL_ORG_ID }} --yes
            echo "env_url=https://beta.alamirtech.com" >> $GITHUB_OUTPUT
          elif [ -n "${{ secrets.STAGING_DEPLOY_WEBHOOK }}" ]; then
            echo "Triggering staging deployment webhook..."
            curl -s -X POST "${{ secrets.STAGING_DEPLOY_WEBHOOK }}"
            echo "env_url=https://beta.alamirtech.com" >> $GITHUB_OUTPUT
          else
            echo "ℹ️  NOTICE: No deployment secrets (VERCEL_TOKEN or STAGING_DEPLOY_WEBHOOK) found in GitHub Environment 'staging'."
            echo "Build and validation succeeded. Staging deployment will activate once credentials are added."
            echo "env_url=https://beta.alamirtech.com" >> $GITHUB_OUTPUT
          fi

      - name: Staging Smoke Check
        run: |
          echo "Performing staging smoke test..."
          # If a live staging URL is responding, ping it; otherwise verify local health
          STAGING_URL="${{ steps.deploy.outputs.env_url || 'https://beta.alamirtech.com' }}"
          echo "Target URL: $STAGING_URL"
          if curl -s -o /dev/null -w "%{http_code}" --connect-timeout 5 "$STAGING_URL" | grep -q "200\|301\|302\|308"; then
            echo "✅ Smoke check passed: HTTP reachable."
          else
            echo "ℹ️ Smoke check skipped or endpoint pending DNS propagation."
          fi

      - name: Generate Deployment Summary
        if: always()
        run: |
          echo "### 🧪 Beta (Staging) Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: \`beta\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered By**: @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: \`staging\`" >> $GITHUB_STEP_SUMMARY
