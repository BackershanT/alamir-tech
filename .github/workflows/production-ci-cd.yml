name: Production CI/CD

on:
  push:
    branches:
      - master
    tags:
      - 'v*.*.*'

# Never cancel production deployment jobs in progress
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  validate:
    name: Lint, Test & Validate (Production)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Code Formatting & Lint Check
        run: npm run lint

      - name: Run Full Test Suite (if configured)
        run: npm test --if-present

  build-and-deploy:
    name: Build & Deploy to Production
    needs: validate
    runs-on: ubuntu-latest
    # GitHub Environment 'production' natively enforces required reviewers / authorized sign-off
    environment:
      name: production
      url: ${{ steps.deploy.outputs.env_url || 'https://alamirtech.com' }}
    env:
      NODE_ENV: production
      APP_ENV: production
      NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL || 'https://alamirtech.com' }}
      NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'https://api.alamirtech.com/api' }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js Production Artifact
        run: npm run build

      - name: Deploy to Production
        id: deploy
        run: |
          echo "=============================================="
          echo "Deploying to PRODUCTION Environment"
          echo "Target Branch: master"
          echo "Commit: ${{ github.sha }}"
          echo "Tag / Ref: ${{ github.ref }}"
          echo "=============================================="
          
          if [ -n "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "Deploying via Vercel CLI (Production)..."
            npx vercel --token ${{ secrets.VERCEL_TOKEN }} --scope ${{ secrets.VERCEL_ORG_ID }} --prod --yes
            echo "env_url=https://alamirtech.com" >> $GITHUB_OUTPUT
          elif [ -n "${{ secrets.PROD_DEPLOY_WEBHOOK }}" ]; then
            echo "Triggering production deployment webhook..."
            curl -s -X POST "${{ secrets.PROD_DEPLOY_WEBHOOK }}"
            echo "env_url=https://alamirtech.com" >> $GITHUB_OUTPUT
          else
            echo "ℹ️  NOTICE: No deployment secrets (VERCEL_TOKEN or PROD_DEPLOY_WEBHOOK) found in GitHub Environment 'production'."
            echo "Production build validation succeeded. Production deployment will trigger once credentials are added."
            echo "env_url=https://alamirtech.com" >> $GITHUB_OUTPUT
          fi

      - name: Production Health Check
        run: |
          echo "Performing production health check..."
          PROD_URL="${{ steps.deploy.outputs.env_url || 'https://alamirtech.com' }}"
          echo "Target URL: $PROD_URL"
          if curl -s -o /dev/null -w "%{http_code}" --connect-timeout 8 "$PROD_URL" | grep -q "200\|301\|302\|308"; then
            echo "✅ Production health check passed: HTTP status OK."
          else
            echo "ℹ️ Health check endpoint check finished (DNS or initial deployment pending)."
          fi

      - name: Generate Production Release Summary
        if: always()
        run: |
          echo "### 🏆 Production Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch/Tag**: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Authorized Deployer**: @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: \`production\`" >> $GITHUB_STEP_SUMMARY
